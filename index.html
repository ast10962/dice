<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Dice Roller</title>

<style>

body{
    background:#1b1b1b;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding-top:30px;
}

h1{
    color:gold;
}

.controls{
    margin:20px;
}

input,select,button{
    padding:10px;
    font-size:18px;
    border-radius:8px;
    border:none;
    margin:5px;
}

button{
    background:gold;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#ffeb3b;
}

.dice-container{
    position:relative;
    width:250px;
    margin:auto;
}

svg{
    width:220px;
    height:220px;
}

.rolling{
    animation:spin 0.2s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

.number{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:60px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 10px gold;
}

.result{
    margin-top:20px;
    font-size:24px;
}

.rolls{
    margin-top:15px;
    font-size:28px;
}

.total{
    margin-top:20px;
    color:gold;
    font-size:40px;
    font-weight:bold;
}

.message{
    margin-top:15px;
    font-size:26px;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>🎲 D&D Dice Roller</h1>

<div class="controls">

    <input
        type="number"
        id="diceCount"
        min="1"
        max="100"
        value="1"
        style="width:80px;">

    <span style="font-size:24px;">d</span>

    <select id="diceType" onchange="changeDiceShape()">
        <option value="4">D4</option>
        <option value="6">D6</option>
        <option value="8">D8</option>
        <option value="10">D10</option>
        <option value="12">D12</option>
        <option value="20" selected>D20</option>
    </select>

</div>

<div class="dice-container">

    <svg id="dice" viewBox="0 0 200 200">

        <polygon
            id="diceShape"
            points="100,10 190,70 160,180 40,180 10,70"
            fill="#c62828"
            stroke="white"
            stroke-width="5"/>

    </svg>

    <div id="number" class="number">20</div>

</div>

<button onclick="rollDice()">🎲 Roll Dice</button>

<div id="result" class="result">
    Ready to Roll
</div>

<script>

const shapes = {

    4:"100,20 180,180 20,180",

    6:"30,30 170,30 170,170 30,170",

    8:"100,10 190,100 100,190 10,100",

    10:"100,10 180,60 160,170 40,170 20,60",

    12:"100,10 145,20 180,50 190,100 180,150 145,180 100,190 55,180 20,150 10,100 20,50 55,20",

    20:"100,10 190,70 160,180 40,180 10,70"
};


/* 
   Web Audio API dice sound.
   No mp3 needed.
   It creates many short noise clicks to imitate dice rolling.
*/

let audioContext;

function getAudioContext(){

    if(!audioContext){
        audioContext =
            new (window.AudioContext || window.webkitAudioContext)();
    }

    return audioContext;
}

function playClickSound(time, volume, pitch){

    const ctx = getAudioContext();

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "square";
    oscillator.frequency.setValueAtTime(pitch, time);

    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(time);
    oscillator.stop(time + 0.04);
}

function playDiceRollSound(){

    const ctx = getAudioContext();

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const now = ctx.currentTime;

    for(let i=0;i<35;i++){

        const delay = i * 0.045;
        const volume = 0.04 + Math.random() * 0.05;
        const pitch = 120 + Math.random() * 420;

        playClickSound(now + delay, volume, pitch);
    }
}

function playFinalSound(){

    const ctx = getAudioContext();

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const now = ctx.currentTime;

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "triangle";
    oscillator.frequency.setValueAtTime(660, now);
    oscillator.frequency.exponentialRampToValueAtTime(880, now + 0.15);

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.4);
}

function playCriticalFailSound(){

    const ctx = getAudioContext();

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const now = ctx.currentTime;

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "sawtooth";
    oscillator.frequency.setValueAtTime(220, now);
    oscillator.frequency.exponentialRampToValueAtTime(70, now + 0.5);

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.6);
}

function changeDiceShape(){

    const sides =
        document.getElementById("diceType").value;

    document
        .getElementById("diceShape")
        .setAttribute("points", shapes[sides]);

    document
        .getElementById("number")
        .innerText = sides;
}

function rollDice(){

    const count =
        parseInt(document.getElementById("diceCount").value);

    const sides =
        parseInt(document.getElementById("diceType").value);

    if(isNaN(count) || count < 1){
        alert("Please enter at least 1 dice.");
        return;
    }

    if(count > 100){
        alert("Maximum 100 dice only.");
        return;
    }

    playDiceRollSound();

    const dice =
        document.getElementById("dice");

    const number =
        document.getElementById("number");

    const result =
        document.getElementById("result");

    dice.classList.add("rolling");

    const ticker = setInterval(()=>{

        number.innerText =
            Math.floor(Math.random()*sides)+1;

    },50);

    setTimeout(()=>{

        clearInterval(ticker);

        let rolls = [];
        let total = 0;

        for(let i=0;i<count;i++){

            let roll =
                Math.floor(Math.random()*sides)+1;

            rolls.push(roll);

            total += roll;
        }

        number.innerText = total;

        dice.classList.remove("rolling");

        let message = "";

        if(
            sides === 20 &&
            rolls.includes(20)
        ){
            message =
            "<div class='message' style='color:gold;'>🌟 Natural 20!</div>";

            playFinalSound();
        }
        else if(
            rolls.every(x => x===1)
        ){
            message =
            "<div class='message' style='color:red;'>💀 Critical Failure!</div>";

            playCriticalFailSound();
        }
        else{
            playFinalSound();
        }

        result.innerHTML =

        `
        <div>
            <b>${count}d${sides}</b>
        </div>

        <div class="rolls">
            [ ${rolls.join(" ] [ ")} ]
        </div>

        <div class="total">
            Total = ${total}
        </div>

        ${message}
        `;

    },2000);
}

changeDiceShape();

</script>

</body>
</html>
