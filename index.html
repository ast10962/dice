<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D&D Dice Roller</title>

<style>

body{
    background:#1a1a1a;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:30px;
}

h1{
    color:gold;
}

.controls{
    margin:20px;
}

input,
select,
button{
    padding:10px;
    font-size:18px;
    border-radius:10px;
    border:none;
}

button{
    background:gold;
    font-weight:bold;
    cursor:pointer;
    margin-left:10px;
}

button:hover{
    background:#ffeb3b;
}

.diceDisplay{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:30px;
    min-height:120px;
}

.die{

    width:90px;
    height:90px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#c62828;

    border:3px solid white;

    border-radius:15px;

    font-size:32px;
    font-weight:bold;

    color:white;

    box-shadow:0 0 15px rgba(255,215,0,.3);
}

.rolling{
    animation:spin .25s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.result{
    margin-top:25px;
    font-size:24px;
}

.total{
    margin-top:20px;
    font-size:42px;
    color:gold;
    font-weight:bold;
}

.critical{
    color:gold;
    font-size:32px;
    font-weight:bold;
    animation:pulse 1s infinite;
}

.fail{
    color:red;
    font-size:32px;
    font-weight:bold;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

.goldGlow{
    background:#5c4500;
}

.redGlow{
    background:#400000;
}

</style>
</head>
<body>

<h1>🎲 D&D Dice Roller</h1>

<div class="controls">

<input
    id="diceCount"
    type="number"
    min="1"
    max="5"
    value="1"
    style="width:70px;">

<span style="font-size:24px;">d</span>

<select id="diceType">

    <option value="4">D4</option>
    <option value="6">D6</option>
    <option value="8">D8</option>
    <option value="10">D10</option>
    <option value="12">D12</option>
    <option value="20" selected>D20</option>

</select>

<button onclick="rollDice()">
🎲 Roll
</button>

</div>

<div
    id="diceDisplay"
    class="diceDisplay">
</div>

<div
    id="result"
    class="result">

Ready to Roll

</div>

<script>

let audioContext;

function getAudioContext(){

    if(!audioContext){

        audioContext =
            new(window.AudioContext
            || window.webkitAudioContext)();

    }

    return audioContext;
}

function clickSound(time){

    const ctx = getAudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type="square";

    osc.frequency.value =
        100 + Math.random()*400;

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    gain.gain.setValueAtTime(
        0.03,
        time
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        time + 0.04
    );

    osc.start(time);

    osc.stop(time + 0.04);
}

function playDiceSound(){

    const ctx =
        getAudioContext();

    if(ctx.state==="suspended"){
        ctx.resume();
    }

    const now =
        ctx.currentTime;

    for(let i=0;i<35;i++){

        clickSound(
            now + i*0.045
        );

    }
}

function playSuccess(){

    const ctx =
        getAudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type="triangle";

    osc.frequency.setValueAtTime(
        650,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        900,
        ctx.currentTime + 0.25
    );

    gain.gain.setValueAtTime(
        0.12,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.4
    );

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    osc.start();

    osc.stop(
        ctx.currentTime + 0.4
    );
}

function playFail(){

    const ctx =
        getAudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type="sawtooth";

    osc.frequency.setValueAtTime(
        250,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        80,
        ctx.currentTime + 0.5
    );

    gain.gain.setValueAtTime(
        0.12,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + 0.5
    );

    osc.connect(gain);

    gain.connect(
        ctx.destination
    );

    osc.start();

    osc.stop(
        ctx.currentTime + 0.5
    );
}

function rollDice(){

    document.body.classList.remove(
        "goldGlow",
        "redGlow"
    );

    const count =
        parseInt(
            document.getElementById(
                "diceCount"
            ).value
        );

    const sides =
        parseInt(
            document.getElementById(
                "diceType"
            ).value
        );

    if(count < 1 || count > 5){

        alert(
            "Please select 1-5 dice."
        );

        return;
    }

    playDiceSound();

    const display =
        document.getElementById(
            "diceDisplay"
        );

    const result =
        document.getElementById(
            "result"
        );

    display.innerHTML = "";

    for(let i=0;i<count;i++){

        display.innerHTML +=
        `
        <div class="die rolling" id="d${i}">
            ?
        </div>
        `;

    }

    const animation =
        setInterval(()=>{

        for(let i=0;i<count;i++){

            document.getElementById(
                "d"+i
            ).innerHTML =
                Math.floor(
                    Math.random()*sides
                )+1;

        }

    },60);

    setTimeout(()=>{

        clearInterval(
            animation
        );

        let total = 0;

        let rolls = [];

        for(let i=0;i<count;i++){

            let roll =
                Math.floor(
                    Math.random()*sides
                )+1;

            rolls.push(
                roll
            );

            total += roll;

            let die =
                document.getElementById(
                    "d"+i
                );

            die.innerHTML =
                roll;

            die.classList.remove(
                "rolling"
            );
        }

        let message = "";

        if(
            sides==20 &&
            rolls.includes(20)
        ){

            playSuccess();

            document.body.classList.add(
                "goldGlow"
            );

            message =
            `
            <div class="critical">
            🌟 NATURAL 20!
            </div>
            `;
        }

        if(
            rolls.every(
                x => x===1
            )
        ){

            playFail();

            document.body.classList.add(
                "redGlow"
            );

            message =
            `
            <div class="fail">
            💀 CRITICAL FAIL!
            </div>
            `;
        }

        result.innerHTML =
        `
        <div>
            <b>${count}d${sides}</b>
        </div>

        <div style="
            margin-top:15px;
            font-size:28px;">
            [ ${rolls.join(" ] [ ")} ]
        </div>

        <div class="total">
            Total = ${total}
        </div>

        ${message}
        `;

    },2000);
}

</script>

</body>
</html>
